{% extends "base.html" %}

{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<h2>Restablecer contraseña</h2>
<p>Introduce tu email para recibir el enlace de recuperación.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Enviar enlace</button>
</form>
{% endblock %}
